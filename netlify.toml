# =============================================================================
# Luma Agency — Netlify configuration
#
# Netlify serves the FRONTEND only. The backend stays on Firebase:
#   Authentication · Firestore · Realtime Database · Cloud Functions · Storage
# Those are reached directly from the browser over HTTPS, so they work from any
# origin — provided the Netlify domain is listed under
#   Firebase Console → Authentication → Settings → Authorized domains
# =============================================================================

[build]
  # build.js copies only browser files into dist/, keeping functions/, the seed
  # scripts, emulator-data (which contains password hashes) and .env off the CDN.
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --------------------------------------------------------------------- routing
# The app uses hash routing (#/tasks, #/clients), so no SPA rewrite is needed —
# only the two real documents plus a friendly alias.
[[redirects]]
  from = "/app"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

# --------------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The app is internal — keep it out of search results.
    X-Robots-Tag = "noindex, nofollow"

# Fonts are content-hashed by name and never change.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Revalidate code on every load so a deploy reaches users immediately.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must never be cached, or push registration goes stale.
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
